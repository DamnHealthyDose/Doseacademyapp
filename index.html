<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Keep in sync with src/context/ThemeContext.tsx (key 'dose-theme', 'dark' class on <html>). -->
    <script>
      (function () {
        var dark;
        try {
          var t = localStorage.getItem('dose-theme');
          dark = t === 'dark' || ((t === null || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {
          dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <style>
      /* Mirrors the background variable in src/index.css (:root and .dark). */
      html, body { background-color: #f3f7f6; }
      html:not(.dark) { color-scheme: light; }
      html.dark, html.dark body { background-color: #0a1a1a; color-scheme: dark; }
    </style>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <title>DOSE Academy | ADHD Tools for Teens Ages 10-17</title>
    <meta name="description" content="Evidence-based ADHD tools built for teens: homework help, emotional tools, and peer support, guided by Slick, your AI companion." />

    <meta property="og:title" content="DOSE Academy | ADHD Tools for Teens Ages 10-17" />
    <meta property="og:description" content="Evidence-based ADHD tools built for teens: homework help, emotional tools, and peer support, guided by Slick, your AI companion." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://learn.getdose.app" />
    <meta property="og:image" content="https://learn.getdose.app/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DOSE Academy | ADHD Tools for Teens Ages 10-17" />
    <meta name="twitter:description" content="Evidence-based ADHD tools built for teens: homework help, emotional tools, and peer support, guided by Slick, your AI companion." />
    <meta name="twitter:image" content="https://learn.getdose.app/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
